<title>Portfolio Intro Animation</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Noto+Sans+TC:wght@300;400;500&display=swap">
<style>
  :root {
    --bg: #000; --fg: #e8e4de; --dim: #8a7e72; --acc: #c8956c;
    --mono: 'JetBrains Mono', monospace;
    --serif: 'Cormorant Garamond', serif;
    --tc: 'Noto Sans TC', sans-serif;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { color-scheme: dark } }
  :root[data-theme="light"] { color-scheme: dark }

  html, body { height: 100%; overflow: hidden }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--mono);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; align-items: center; justify-content: center;
  }

  .intro {
    position: fixed; inset: 0; z-index: 100; background: #000;
    display: flex; align-items: center; justify-content: center;
    perspective: 800px; overflow: hidden;
    opacity: 1; transition: opacity 1s ease;
  }
  .intro.done { opacity: 0; pointer-events: none }

  /* Photo grid */
  .grid-wrap {
    position: absolute; inset: -10%; /* overflow for rotation */
    display: grid;
    grid-template-columns: repeat(var(--cols), 1fr);
    grid-template-rows: repeat(var(--rows), 1fr);
    gap: 3px;
    transform: rotateX(2deg) rotateY(-1deg) scale(1.05);
    transform-style: preserve-3d;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .grid-wrap.show { opacity: 1 }
  .grid-wrap.zoom {
    transition: transform 1.2s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.6s ease 0.6s;
    transform: rotateX(0) rotateY(0) scale(2.5);
    opacity: 0;
  }

  .cell {
    background-size: cover; background-position: center;
    position: relative; overflow: hidden;
    opacity: 0;
  }
  .cell::after {
    content: ''; position: absolute; inset: 0;
    background: rgba(0,0,0,0.15);
  }

  /* Center text overlay */
  .title-layer {
    position: absolute; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    pointer-events: none;
  }
  .title-name {
    font-family: var(--serif); font-weight: 300;
    font-size: clamp(36px, 8vw, 80px);
    letter-spacing: 0.25em; text-transform: uppercase;
    color: var(--fg); opacity: 0;
    transform: scale(0.9);
    transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    text-shadow: 0 0 60px rgba(0,0,0,0.8), 0 0 120px rgba(0,0,0,0.6);
  }
  .title-name.show { opacity: 1; transform: scale(1) }

  .title-sub {
    font-family: var(--mono); font-size: clamp(8px, 1.4vw, 11px);
    letter-spacing: 0.6em; text-transform: uppercase;
    color: var(--acc); margin-top: 12px; opacity: 0;
    transition: opacity 0.6s ease 0.3s;
    text-shadow: 0 0 30px rgba(0,0,0,0.8);
  }
  .title-sub.show { opacity: 1 }

  /* Flash */
  .flash {
    position: absolute; inset: 0; z-index: 5;
    background: #fff; opacity: 0; pointer-events: none;
  }

  /* Vignette */
  .vignette {
    position: absolute; inset: 0; z-index: 3; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.7) 100%);
    opacity: 0; transition: opacity 0.8s ease;
  }
  .vignette.show { opacity: 1 }

  /* Scanline */
  .scanline {
    position: absolute; inset: 0; z-index: 4; pointer-events: none;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 2px,
      rgba(255,255,255,0.006) 2px, rgba(255,255,255,0.006) 4px
    );
  }

  /* Replay */
  .replay {
    position: fixed; bottom: max(24px, env(safe-area-inset-bottom, 0px));
    right: max(24px, env(safe-area-inset-right, 0px));
    z-index: 200; font-family: var(--mono); font-size: 10px;
    letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--dim); background: rgba(255,255,255,0.06);
    border: 0.5px solid rgba(255,255,255,0.1);
    padding: 8px 16px; cursor: pointer;
    transition: color 0.2s, border-color 0.2s;
  }
  .replay:hover { color: var(--fg); border-color: rgba(255,255,255,0.25) }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>

<div class="intro" id="intro">
  <div class="grid-wrap" id="gridWrap"></div>
  <div class="vignette" id="vignette"></div>
  <div class="scanline"></div>
  <div class="flash" id="flash"></div>
  <div class="title-layer">
    <div class="title-name" id="titleName">Tony Hou</div>
    <div class="title-sub" id="titleSub">Photography</div>
  </div>
</div>
<button class="replay" id="replayBtn" hidden>Replay</button>

const W = window.innerWidth;
const H = window.innerHeight;
const COLS = W < 600 ? 5 : W < 1000 ? 7 : 9;
const ROWS = W < 600 ? 7 : W < 1000 ? 5 : 6;
const TOTAL = COLS * ROWS;

const gridWrap = document.getElementById('gridWrap');
gridWrap.style.setProperty('--cols', COLS);
gridWrap.style.setProperty('--rows', ROWS);

// Create cells
const cells = [];
for (let i = 0; i < TOTAL; i++) {
  const cell = document.createElement('div');
  cell.className = 'cell';
  cell.style.backgroundImage = `url(${PHOTOS[i % PHOTOS.length]})`;
  gridWrap.appendChild(cell);
  cells.push(cell);
}

// Shuffle helper
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function runIntro() {
  const intro = document.getElementById('intro');
  const flash = document.getElementById('flash');
  const vignette = document.getElementById('vignette');
  const titleName = document.getElementById('titleName');
  const titleSub = document.getElementById('titleSub');
  const replayBtn = document.getElementById('replayBtn');

  // Reset
  intro.classList.remove('done');
  intro.style.opacity = '1';
  gridWrap.classList.remove('show', 'zoom');
  vignette.classList.remove('show');
  titleName.classList.remove('show');
  titleSub.classList.remove('show');
  flash.style.opacity = '0';
  replayBtn.hidden = true;
  cells.forEach(c => { c.style.opacity = '0'; c.style.transition = 'none' });

  // Phase 1: Cells appear one by one rapidly (0 - 1.5s)
  const order = shuffle([...Array(TOTAL).keys()]);
  const stagger = 1200 / TOTAL;

  setTimeout(() => gridWrap.classList.add('show'), 100);

  order.forEach((idx, i) => {
    setTimeout(() => {
      cells[idx].style.transition = 'opacity 0.15s ease';
      cells[idx].style.opacity = '1';
    }, 200 + i * stagger);
  });

  // Phase 2: Rapid photo cycling (0.8s - 3.5s)
  let cycleIntervals = [];
  setTimeout(() => {
    cells.forEach((cell, i) => {
      const speed = 80 + Math.random() * 120; // 80-200ms per swap
      const delay = Math.random() * 300;
      const interval = setTimeout(() => {
        const iv = setInterval(() => {
          const randPhoto = PHOTOS[Math.floor(Math.random() * PHOTOS.length)];
          cell.style.backgroundImage = `url(${randPhoto})`;
        }, speed);
        cycleIntervals.push(iv);
      }, delay);
      cycleIntervals.push(interval);
    });
  }, 800);

  // Phase 3: Flash + stop cycling (3.5s)
  setTimeout(() => {
    // Flash
    flash.style.transition = 'opacity 0.06s ease';
    flash.style.opacity = '0.8';
    setTimeout(() => {
      flash.style.transition = 'opacity 0.4s ease';
      flash.style.opacity = '0';
    }, 80);

    // Stop all cycling
    cycleIntervals.forEach(id => { clearInterval(id); clearTimeout(id) });
    cycleIntervals = [];
  }, 3500);

  // Phase 4: Vignette + darken cells + show title (3.6s)
  setTimeout(() => {
    vignette.classList.add('show');
    cells.forEach(c => {
      c.style.transition = 'opacity 0.8s ease';
      c.style.opacity = '0.3';
    });
  }, 3600);

  // Phase 5: Title appears (3.8s)
  setTimeout(() => {
    titleName.classList.add('show');
    titleSub.classList.add('show');
  }, 3800);

  // Phase 6: Grid zooms in, everything fades (6s)
  setTimeout(() => {
    gridWrap.classList.add('zoom');
  }, 6000);

  // Phase 7: Intro disappears (7.2s)
  setTimeout(() => {
    intro.classList.add('done');
    setTimeout(() => { replayBtn.hidden = false }, 800);
  }, 7200);
}

// Start
runIntro();

document.getElementById('replayBtn').addEventListener('click', runIntro);
</script>
